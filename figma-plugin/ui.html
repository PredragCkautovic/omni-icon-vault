<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Symbols Nerd Font Mono";src:url("http://localhost:17836/browser/assets/nerd-symbols.ttf") format("truetype")}@font-face{font-family:"Material Symbols Outlined";src:url("http://localhost:17836/browser/assets/material-symbols-outlined.ttf") format("truetype")}:root{color-scheme:light dark;--bg:var(--figma-color-bg,#151515);--panel:var(--figma-color-bg-secondary,#202020);--line:var(--figma-color-border,#353535);--text:var(--figma-color-text,#f5f5f5);--muted:var(--figma-color-text-secondary,#999);--accent:var(--figma-color-bg-brand,#7b61ff)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:12px Inter,system-ui,sans-serif;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.head{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:9px}.title{display:flex;justify-content:space-between}.title strong{font-size:13px}.status{font-size:10px;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 130px 64px;gap:7px}input,select{height:34px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:0 8px;outline:none}.grid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;align-content:start}.card{height:94px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;overflow:hidden;padding:6px}.card:hover{border-color:var(--accent)}.icon{width:36px;height:36px;display:grid;place-items:center;font-size:28px}.icon svg,.icon img{width:32px;height:32px;display:block;object-fit:contain}.icon.fill svg{fill:currentColor}.icon.stroke svg{stroke:currentColor}.icon.nerd{font-family:"Symbols Nerd Font Mono"}.icon.material{font-family:"Material Symbols Outlined"}.name,.pack{width:100%;text-align:center;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.name{font-size:9px}.pack{font-size:8px;color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}.foot{border-top:1px solid var(--line);padding:8px 12px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between}
</style></head><body><div class="app"><div class="head"><div class="title"><strong>Omni Icon Vault 4</strong><span class="status" id="status">Connecting…</span></div><div class="controls"><input id="q" placeholder="Search icons, brands, favicons…" autofocus><select id="source"><option value="all">All packs</option><option value="kind:ui">UI icons</option><option value="kind:brand">Brands + favicons</option><option value="kind:developer">Developer</option></select><input id="size" type="number" min="8" max="512" value="24" title="Insert size"></div></div><div id="grid" class="grid"></div><div class="foot"><span>Click = insert into canvas</span><span id="count"></span></div></div><script>
const API='http://localhost:17836',$=s=>document.querySelector(s);let timer=0,items=[];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function sources(){try{const r=await fetch(API+'/api/sources'),d=await r.json();if(!d.ok)return;const s=$('#source');for(const m of d.sources||[]){const o=document.createElement('option');o.value=m.source;o.textContent=`${m.label} (${Number(m.count).toLocaleString()})`;s.appendChild(o)}}catch{}}
function iconHtml(i){if(i.figmaType==='svg')return `<span class="icon ${esc(i.render||'')}" data-preview="${esc(i.id)}">…</span>`;if(i.figmaType==='raster'&&i.raster)return `<span class="icon"><img src="${API+esc(i.raster)}"></span>`;if(i.source==='material')return `<span class="icon material">${esc(i.char||'')}</span>`;return `<span class="icon nerd">${esc(i.char||'')}</span>`}
async function previews(){const ns=[...document.querySelectorAll('[data-preview]')];await Promise.all(ns.slice(0,140).map(async n=>{try{const r=await fetch(API+'/api/icon?id='+encodeURIComponent(n.dataset.preview)),d=await r.json();if(d.ok&&d.icon?.svg)n.innerHTML=d.icon.svg}catch{}}))}
function render(){const g=$('#grid');if(!items.length){g.innerHTML='<div class="empty">No icons found.</div>';return}g.innerHTML=items.map((i,n)=>`<button class="card" data-i="${n}" title="${esc(i.id)}">${iconHtml(i)}<span class="name">${esc(i.label||i.name)}</span><span class="pack">${esc(i.sourceLabel||i.source)}</span></button>`).join('');previews()}
async function search(){clearTimeout(timer);timer=setTimeout(async()=>{try{const q=$('#q').value,source=$('#source').value,r=await fetch(API+'/api/search?q='+encodeURIComponent(q)+'&source='+encodeURIComponent(source)+'&limit=160'),d=await r.json();if(!d.ok)throw Error(d.error||'Search failed');items=d.items||[];$('#status').textContent='Connected';$('#count').textContent=items.length+' results';render()}catch(e){items=[];$('#status').textContent='Server offline';$('#count').textContent='Run omni-icons serve';$('#grid').innerHTML='<div class="empty">Start Omni with <b>./start-pipeline.sh</b>.</div>'}},100)}
$('#q').oninput=search;$('#source').onchange=search;$('#grid').onclick=async e=>{const b=e.target.closest('[data-i]');if(!b)return;const item=items[+b.dataset.i];try{const r=await fetch(API+'/api/icon?id='+encodeURIComponent(item.id)),d=await r.json();if(!d.ok)throw Error(d.error||'Fetch failed');parent.postMessage({pluginMessage:{type:'insert',icon:d.icon,size:Number($('#size').value)||24}},'*')}catch(err){$('#status').textContent=String(err.message||err)}};window.onmessage=e=>{const m=e.data?.pluginMessage;if(m?.type==='inserted')$('#status').textContent='Inserted '+m.id;if(m?.type==='error')$('#status').textContent=m.message};sources().then(search);
</script></body></html>
