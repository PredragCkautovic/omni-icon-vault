<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Symbols Nerd Font Mono";src:url("http://localhost:17836/browser/assets/nerd-symbols.ttf") format("truetype")}@font-face{font-family:"Material Symbols Outlined";src:url("http://localhost:17836/browser/assets/material-symbols-outlined.ttf") format("truetype")}
:root{color-scheme:light dark;--bg:var(--figma-color-bg,#121217);--panel:var(--figma-color-bg-secondary,#1a1a22);--line:var(--figma-color-border,#33333e);--text:var(--figma-color-text,#f4f3f8);--muted:var(--figma-color-text-secondary,#9a97a5);--accent:var(--figma-color-bg-brand,#8a6cf5);--accent2:#bba8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:11px Inter,system-ui,sans-serif;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.header{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:9px;background:var(--bg)}.title{display:flex;align-items:center;justify-content:space-between}.title strong{font-size:13px}.status{font-size:9px;color:var(--muted)}.status.online{color:#74d8a3}.search{height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--text);padding:0 10px;outline:none}.search:focus{border-color:var(--accent)}.filters{display:grid;grid-template-columns:1fr 104px 72px;gap:6px}select,input[type=number]{height:31px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:0 7px;outline:none}.kind-tabs{display:flex;gap:5px;overflow:auto}.kind-tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 8px;font-size:9px;white-space:nowrap;cursor:pointer}.kind-tabs button.active{border-color:var(--accent);color:var(--accent2);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}.content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 150px}.grid{overflow:auto;padding:9px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-content:start}.card{height:88px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;overflow:hidden;padding:6px;position:relative}.card:hover,.card.selected{border-color:var(--accent)}.icon{width:34px;height:34px;display:grid;place-items:center;font-size:27px}.icon svg,.icon img{width:31px!important;height:31px!important;display:block;object-fit:contain}.icon.fill svg{fill:currentColor}.icon.stroke svg{stroke:currentColor}.icon.nerd{font-family:"Symbols Nerd Font Mono"}.icon.material{font-family:"Material Symbols Outlined"}.name,.pack{width:100%;text-align:center;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.name{font-size:8px}.pack{font-size:7px;color:var(--muted)}.fav{position:absolute;right:3px;top:2px;border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}.fav.on{color:#e6ca61}.detail{border-left:1px solid var(--line);padding:10px;overflow:auto;background:var(--bg)}.detail-preview{height:112px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;place-items:center;font-size:52px;margin-bottom:9px}.detail-preview svg,.detail-preview img{width:54px!important;height:54px!important}.detail h2{font-size:11px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail p{font-size:8px;color:var(--muted);margin:0 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail button{width:100%;height:31px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;margin:0 0 6px;font-size:9px;cursor:pointer}.detail button.primary{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent2)}.empty{grid-column:1/-1;padding:40px 10px;text-align:center;color:var(--muted)}.footer{border-top:1px solid var(--line);padding:7px 10px;color:var(--muted);font-size:8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title"><strong>Omni Icon Vault</strong><span class="status" id="status">Connecting…</span></div>
    <input class="search" id="q" placeholder="Search camera, github, python, arrow…" autofocus>
    <div class="kind-tabs" id="kindTabs">
      <button class="active" data-source="all">All</button><button data-source="kind:ui">UI</button><button data-source="kind:brand">Brands</button><button data-source="kind:developer">Developer</button><button data-source="favorites">Favorites</button>
    </div>
    <div class="filters"><select id="source"><option value="all">All packs</option></select><select id="format"><option value="all">All formats</option><option value="svg">SVG</option><option value="font">Font</option><option value="raster">Raster</option></select><input id="size" type="number" min="8" max="512" value="24" title="Insert size"></div>
  </div>
  <div class="content"><div id="grid" class="grid"></div><aside class="detail" id="detail"><div class="empty">Select an icon</div></aside></div>
  <div class="footer"><span>Double-click or Insert → canvas</span><span id="count"></span></div>
</div>
<script>
const API='http://localhost:17836',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let timer=0,items=[],selected=null,kind='all',favorites=new Set(JSON.parse(localStorage.getItem('omniFigmaFavorites')||'[]'));
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function iconHtml(i,cls='icon'){if(i.svg)return `<span class="${cls} ${esc(i.render||'')}">${i.svg}</span>`;if(i.figmaType==='raster'&&i.raster)return `<span class="${cls}"><img src="${API+esc(i.raster)}"></span>`;if(i.source==='material')return `<span class="${cls} material">${esc(i.char||'')}</span>`;return `<span class="${cls} nerd">${esc(i.char||'')}</span>`}
async function json(url){const r=await fetch(url),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Request failed');return d}
async function sources(){try{const d=await json(API+'/api/sources');for(const m of d.sources||[]){const o=document.createElement('option');o.value=m.source;o.textContent=`${m.label} (${Number(m.count).toLocaleString()})`;$('#source').appendChild(o)}}catch{}}
function filteredFavorites(){return items.filter(i=>favorites.has(i.id))}
function render(){const xs=kind==='favorites'?filteredFavorites():items;const g=$('#grid');$('#count').textContent=xs.length+' results';if(!xs.length){g.innerHTML='<div class="empty">No icons found.</div>';return}g.innerHTML=xs.map((i,n)=>`<button class="card ${selected?.id===i.id?'selected':''}" data-id="${esc(i.id)}" title="${esc(i.id)}">${iconHtml(i)}<span class="name">${esc(i.label||i.name)}</span><span class="pack">${esc(i.sourceLabel||i.source)}</span><span class="fav ${favorites.has(i.id)?'on':''}" data-fav="${esc(i.id)}">${favorites.has(i.id)?'★':'☆'}</span></button>`).join('')}
function showDetail(i){selected=i;render();$('#detail').innerHTML=`<div class="detail-preview">${iconHtml(i,'icon')}</div><h2 title="${esc(i.label||i.name)}">${esc(i.label||i.name)}</h2><p title="${esc(i.id)}">${esc(i.id)}</p><button class="primary" id="insert">Insert ${Number($('#size').value)||24}px</button><button id="copyId">Copy icon ID</button><button id="toggleFav">${favorites.has(i.id)?'★ Remove favorite':'☆ Add favorite'}</button>`;$('#insert').onclick=()=>insert(i);$('#copyId').onclick=()=>navigator.clipboard.writeText(i.id);$('#toggleFav').onclick=()=>toggleFav(i.id)}
function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('omniFigmaFavorites',JSON.stringify([...favorites]));if(selected?.id===id)showDetail(selected);render()}
async function search(){clearTimeout(timer);timer=setTimeout(async()=>{try{let source=kind==='favorites'?'all':kind;const pack=$('#source').value;if(pack!=='all')source=pack;const p=new URLSearchParams({q:$('#q').value,source,format:$('#format').value,limit:'180',include:'preview'});const d=await json(API+'/api/search?'+p);items=d.items||[];$('#status').textContent='Connected';$('#status').classList.add('online');render()}catch(e){items=[];$('#status').textContent='Server offline';$('#status').classList.remove('online');$('#grid').innerHTML='<div class="empty">Run <b>omni-icons start</b> and reopen the plugin.</div>';$('#count').textContent=''}},90)}
async function insert(i){try{let full=i;if(!i.svg&&i.figmaType==='svg'){const d=await json(API+'/api/icon?id='+encodeURIComponent(i.id));full=d.icon}parent.postMessage({pluginMessage:{type:'insert',icon:full,size:Number($('#size').value)||24}},'*')}catch(e){$('#status').textContent=e.message}}
$('#q').oninput=search;$('#source').onchange=search;$('#format').onchange=search;$('#kindTabs').onclick=e=>{const b=e.target.closest('[data-source]');if(!b)return;kind=b.dataset.source;$$('#kindTabs button').forEach(x=>x.classList.toggle('active',x===b));search()};$('#grid').onclick=e=>{const fav=e.target.closest('[data-fav]');if(fav){e.preventDefault();e.stopPropagation();toggleFav(fav.dataset.fav);return}const b=e.target.closest('[data-id]');if(!b)return;const xs=kind==='favorites'?filteredFavorites():items;const i=xs.find(x=>x.id===b.dataset.id);if(i)showDetail(i)};$('#grid').ondblclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const xs=kind==='favorites'?filteredFavorites():items;const i=xs.find(x=>x.id===b.dataset.id);if(i)insert(i)};window.onmessage=e=>{const m=e.data?.pluginMessage;if(m?.type==='inserted'){$('#status').textContent='Inserted';$('#status').classList.add('online')}if(m?.type==='error'){$('#status').textContent=m.message;$('#status').classList.remove('online')}};sources().then(search);
</script>
</body>
</html>
