<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omni Icon Vault</title><link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css"><link rel="stylesheet" href="../vendor/bootstrap/font/bootstrap-icons.min.css"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="style.css"></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">OI</div><div><h1>Omni Icon Vault</h1><p>Icons + brands + favicons</p></div></div>
<nav class="source-list" id="sourceList">
<button class="source active" data-source="all"><span>All icons</span><b id="count-all">0</b></button>
<button class="source" data-source="kind:ui"><span>UI icons</span><b id="count-ui">0</b></button>
<button class="source" data-source="kind:brand"><span>Brands + Favicons</span><b id="count-brand">0</b></button>
<button class="source" data-source="kind:developer"><span>Developer</span><b id="count-developer">0</b></button>
<button class="source" data-source="favorites"><span>Favorites</span><b id="count-favorites">0</b></button>
<div class="nav-heading">PACKS</div><div id="packSources"></div></nav>
<div class="sidebar-note"><strong>Add any website favicon</strong><code>omni-icons favicon add example.com</code><span><kbd>/</kbd> Search</span><span><kbd>Esc</kbd> Close details</span></div></aside>
<main class="main"><header class="topbar"><div class="search-wrap"><svg viewBox="0 0 24 24"><path d="m21 21-4.3-4.3m2.3-5.2A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/></svg><input id="search" autocomplete="off" placeholder="Search: camera, github, figma, linux, arrow, favicon…"><kbd>/</kbd></div><select id="copyMode"><option value="smart">Copy: Smart default</option><option value="svg">Copy: SVG</option><option value="glyph">Copy: Glyph</option><option value="html">Copy: HTML</option><option value="css">Copy: CSS</option><option value="id">Copy: Canonical ID</option></select></header>
<section class="toolbar"><div><h2 id="viewTitle">All icons</h2><p id="resultText">Loading local index…</p></div><div class="toolbar-actions"><button id="clearSearch" class="ghost">Clear</button><button id="randomIcon" class="ghost">Random</button></div></section><section class="icon-grid" id="grid"></section><div class="empty hidden" id="empty"><div>⌕</div><h3>No icons found</h3><p>Try another term or pack.</p></div><button id="loadMore" class="load-more hidden">Show more</button></main></div>
<div class="toast" id="toast">Copied</div><dialog id="details"><button class="dialog-close" id="closeDialog">×</button><div class="detail-preview" id="detailPreview"></div><div class="detail-meta"><div class="eyebrow" id="detailSource"></div><h2 id="detailName"></h2><p id="detailCode"></p><div class="copy-stack"><button data-copy="id"><b>Icon ID</b><code id="idValue"></code></button><button data-copy="glyph" id="glyphCopyButton"><b>Glyph</b><span id="glyphValue"></span></button><button data-copy="html"><b>HTML</b><code id="htmlValue"></code></button><button data-copy="css"><b>CSS</b><code id="cssValue"></code></button><button data-copy="svg" id="svgCopyButton"><b>SVG</b><span>Copy editable vector</span></button><button data-copy="asset" id="assetCopyButton"><b>Asset</b><span id="assetValue">Copy local asset path</span></button></div><button id="favoriteButton" class="favorite-button">☆ Add to favorites</button></div></dialog>
<script src="icon-data.js"></script><script src="source-meta.js"></script><script src="app.js"></script></body></html>
