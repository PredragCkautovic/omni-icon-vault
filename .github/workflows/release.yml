name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q install.py uninstall.py omni.py tools scripts tests

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate tag matches VERSION
        shell: bash
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Build release archives
        run: python scripts/build_release.py --dist dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Omni-Icon-Vault-*.zip \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "Omni Icon Vault $(cat VERSION)"
