name: Bug report
description: Report a reproducible Omni Icon Vault problem
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Omni version
      placeholder: "4.1.1"
    validations: {required: true}
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: omni-icons doctor output
      render: shell
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations: {required: true}
