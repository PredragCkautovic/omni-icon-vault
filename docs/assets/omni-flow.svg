<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Omni Icon Vault workflow</title><desc id="desc">One local icon index powers the Web UI, Figma plugin, CLI and project exports.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0b14"/><stop offset="1" stop-color="#171127"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="48" fill="#f5f3ff" font-size="24" font-weight="700">One source of truth from discovery to production</text>
  <text x="600" y="76" fill="#a1a1b5" font-size="14">Every surface uses the same canonical icon ID and local index.</text>
  <g transform="translate(70 122)">
    <rect width="220" height="120" rx="20" fill="#11111c" stroke="#34324a"/><circle cx="110" cy="38" r="22" fill="#22183b"/><path d="M99 38h22M110 27v22" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/><text x="110" y="82" fill="#f5f3ff" font-size="18" font-weight="700">Icon sources</text><text x="110" y="104" fill="#8f8da4" font-size="13">packs · favicons · custom SVG</text>
  </g>
  <path d="M310 182h90" stroke="#6d5ac8" stroke-width="3" stroke-linecap="round"/><path d="m394 176 10 6-10 6" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <g transform="translate(420 105)" filter="url(#glow)">
    <rect width="360" height="154" rx="24" fill="#171126" stroke="#7c3aed"/><rect x="22" y="22" width="54" height="54" rx="15" fill="url(#accent)"/><rect x="39" y="39" width="20" height="20" fill="none" stroke="white" stroke-width="4"/><text x="202" y="55" fill="#f5f3ff" font-size="22" font-weight="800">Unified local index</text><text x="202" y="81" fill="#b8b5c9" font-size="14">fast search · capabilities · metadata</text><text x="180" y="121" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">tabler:outline:camera</text>
  </g>
  <path d="M800 182h90" stroke="#6d5ac8" stroke-width="3" stroke-linecap="round"/><path d="m884 176 10 6-10 6" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <g transform="translate(910 112)">
    <rect width="220" height="140" rx="20" fill="#11111c" stroke="#34324a"/><text x="110" y="34" fill="#f5f3ff" font-size="17" font-weight="700">Use it anywhere</text>
    <g fill="#c4b5fd" font-size="13"><text x="55" y="69">Web UI</text><text x="165" y="69">Figma</text><text x="55" y="99">CLI/API</text><text x="165" y="99">React</text><text x="55" y="125">Vue</text><text x="165" y="125">Svelte</text></g>
  </g>
  <text x="600" y="322" fill="#8f8da4" font-size="13">SVG · Glyph · HTML · CSS · JSON · framework components</text>
</g>
</svg>
