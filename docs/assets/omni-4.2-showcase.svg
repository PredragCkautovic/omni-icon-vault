<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">Omni Icon Vault 4.2 flagship workspace</title>
<desc id="desc">A dark purple product showcase for Omni Icon Vault with local search, filters, icon grid, details panel, React JSX, Figma and cross-platform workflow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08080e"/><stop offset=".55" stop-color="#0d0b18"/><stop offset="1" stop-color="#08090f"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c0a6ff"/><stop offset=".48" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b32c9"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151520"/><stop offset="1" stop-color="#101018"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".34"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".45"/></filter>
  <style>
    .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f7f5ff}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9b97aa}.p{fill:url(#panel);stroke:#302a42;stroke-width:1}.soft{fill:#191727;stroke:#342d49}.accent{fill:#bda8ff}.tiny{font-size:12px}.small{font-size:14px}.label{font-size:13px;font-weight:700}.icon{fill:none;stroke:#efeaff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1600" height="860" rx="28" fill="url(#bg)"/>
<circle cx="184" cy="85" r="250" fill="url(#glow)"/><circle cx="1390" cy="690" r="310" fill="url(#glow)" opacity=".6"/>
<path d="M0 730 C300 650 420 835 760 735 S1260 640 1600 760" fill="none" stroke="#6f42e6" stroke-opacity=".24" stroke-width="2"/>
<path d="M0 760 C330 690 470 850 800 760 S1260 675 1600 800" fill="none" stroke="#a78bfa" stroke-opacity=".12" stroke-width="1"/>

<!-- heading -->
<g transform="translate(58 54)">
  <rect width="70" height="70" rx="20" fill="url(#brand)" filter="url(#shadow)"/>
  <rect x="20" y="20" width="30" height="30" rx="3" fill="none" stroke="#fff" stroke-width="5"/>
  <text class="t" x="92" y="35" font-size="34" font-weight="800">Omni Icon Vault <tspan fill="#a78bfa">4.2</tspan></text>
  <text class="m" x="92" y="61" font-size="16">One local icon workspace. Design → code without losing identity.</text>
</g>
<g transform="translate(1112 60)">
  <rect class="soft" width="126" height="34" rx="17"/><circle cx="18" cy="17" r="4" fill="#71d6a0"/><text class="t tiny" x="31" y="22">LOCAL FIRST</text>
  <rect class="soft" x="136" width="112" height="34" rx="17"/><text class="t tiny" x="158" y="22">FIGMA READY</text>
  <rect class="soft" x="258" width="136" height="34" rx="17"/><text class="t tiny" x="279" y="22">CROSS PLATFORM</text>
</g>

