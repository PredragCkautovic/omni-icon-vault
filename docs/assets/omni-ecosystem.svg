<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Omni Icon Vault source ecosystem</title><desc id="desc">Four categories of icon sources: UI, brands, developer and personal sources.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0c15"/><stop offset="1" stop-color="#161122"/></linearGradient></defs>
<rect width="1200" height="310" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="60" y="55" fill="#f5f3ff" font-size="25" font-weight="800">A broad icon ecosystem, one search box</text>
<text x="60" y="82" fill="#9b99ad" font-size="14">Upstream packs stay separate; Omni normalizes discovery, capabilities and export.</text>
<g transform="translate(60 116)">
  <g><rect width="250" height="130" rx="18" fill="#12121e" stroke="#312d46"/><circle cx="34" cy="34" r="14" fill="#6d28d9"/><text x="60" y="39" fill="#f5f3ff" font-size="17" font-weight="700">UI & interface</text><text x="22" y="73" fill="#aaa7bb" font-size="13">Tabler · Lucide · Heroicons</text><text x="22" y="96" fill="#aaa7bb" font-size="13">Material · Bootstrap · Fluent</text><text x="22" y="119" fill="#aaa7bb" font-size="13">Phosphor · Iconoir · Ionicons</text></g>
  <g transform="translate(275)"><rect width="250" height="130" rx="18" fill="#12121e" stroke="#312d46"/><circle cx="34" cy="34" r="14" fill="#7c3aed"/><text x="60" y="39" fill="#f5f3ff" font-size="17" font-weight="700">Brands</text><text x="22" y="73" fill="#aaa7bb" font-size="13">Simple Icons</text><text x="22" y="96" fill="#aaa7bb" font-size="13">Font Awesome Brands</text><text x="22" y="119" fill="#aaa7bb" font-size="13">collected website favicons</text></g>
  <g transform="translate(550)"><rect width="250" height="130" rx="18" fill="#12121e" stroke="#312d46"/><circle cx="34" cy="34" r="14" fill="#8b5cf6"/><text x="60" y="39" fill="#f5f3ff" font-size="17" font-weight="700">Developer</text><text x="22" y="73" fill="#aaa7bb" font-size="13">Nerd Fonts Symbols</text><text x="22" y="96" fill="#aaa7bb" font-size="13">Octicons · Devicon</text><text x="22" y="119" fill="#aaa7bb" font-size="13">terminal + language glyphs</text></g>
  <g transform="translate(825)"><rect width="250" height="130" rx="18" fill="#12121e" stroke="#312d46"/><circle cx="34" cy="34" r="14" fill="#a78bfa"/><text x="60" y="39" fill="#f5f3ff" font-size="17" font-weight="700">Your library</text><text x="22" y="73" fill="#aaa7bb" font-size="13">custom SVG folders</text><text x="22" y="96" fill="#aaa7bb" font-size="13">project-specific artwork</text><text x="22" y="119" fill="#aaa7bb" font-size="13">private local additions</text></g>
</g>
</g>
</svg>
