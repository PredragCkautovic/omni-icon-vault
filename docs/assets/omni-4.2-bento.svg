<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Omni Icon Vault 4.2 feature highlights</title><desc id="desc">Four product cards showing React JSX, icon deep links, Figma insertion and local-first workflow.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0a12"/><stop offset="1" stop-color="#141020"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6d3dde"/></linearGradient></defs>
<rect width="1200" height="330" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="52" y="50" fill="#f7f5ff" font-size="24" font-weight="800">4.2 is built for the moment after you find the icon.</text>
<text x="52" y="77" fill="#9c98ab" font-size="14">Copy it, share it, insert it, or carry the same canonical ID into code.</text>
<g transform="translate(50 108)"><rect width="260" height="168" rx="19" fill="#12121c" stroke="#302b41"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#241a3d"/><text x="31" y="45" fill="#c4b5fd" font-size="20" font-weight="800">R</text><text x="72" y="36" fill="#f7f5ff" font-size="17" font-weight="800">React JSX</text><text x="72" y="56" fill="#8f8b9e" font-size="12">first-class copy/filter mode</text><text x="18" y="95" fill="#aaa6b9" font-size="13">SVG-backed icons become a</text><text x="18" y="116" fill="#aaa6b9" font-size="13">ready-to-drop JSX component.</text><rect x="18" y="132" width="116" height="24" rx="7" fill="#201833" stroke="#5f48a5"/><text x="34" y="149" fill="#c4b5fd" font-size="10" font-weight="700">COPY REACT</text></g>
<g transform="translate(330 108)"><rect width="260" height="168" rx="19" fill="#12121c" stroke="#302b41"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#241a3d"/><text x="29" y="44" fill="#c4b5fd" font-size="20">↗</text><text x="72" y="36" fill="#f7f5ff" font-size="17" font-weight="800">Deep links</text><text x="72" y="56" fill="#8f8b9e" font-size="12">return to the exact icon</text><text x="18" y="95" fill="#aaa6b9" font-size="13">Share a localhost link carrying</text><text x="18" y="116" fill="#aaa6b9" font-size="13">the canonical icon ID.</text><text x="18" y="148" fill="#a78bfa" font-size="10">?icon=tabler:outline:camera</text></g>
<g transform="translate(610 108)"><rect width="260" height="168" rx="19" fill="#12121c" stroke="#302b41"/><rect x="18" y="18" width="40" height="40" rx="12" fill="url(#a)"/><circle cx="38" cy="30" r="4" fill="#fff"/><rect x="28" y="37" width="8" height="8" rx="2" fill="#fff"/><path d="M40 37h8v8h-8z" fill="#fff" opacity=".78"/><text x="72" y="36" fill="#f7f5ff" font-size="17" font-weight="800">Figma workflow</text><text x="72" y="56" fill="#8f8b9e" font-size="12">search → size → insert</text><text x="18" y="95" fill="#aaa6b9" font-size="13">Use common size presets and</text><text x="18" y="116" fill="#aaa6b9" font-size="13">insert editable SVG vectors.</text><text x="18" y="148" fill="#a78bfa" font-size="10">16 · 24 · 32 · 48 · 64 · 96 · 128</text></g>
<g transform="translate(890 108)"><rect width="260" height="168" rx="19" fill="#12121c" stroke="#302b41"/><rect x="18" y="18" width="40" height="40" rx="12" fill="#182a24"/><path d="M30 38 36 44 47 31" fill="none" stroke="#74d8a3" stroke-width="3" stroke-linecap="round"/><text x="72" y="36" fill="#f7f5ff" font-size="17" font-weight="800">Local by design</text><text x="72" y="56" fill="#8f8b9e" font-size="12">one index, every surface</text><text x="18" y="95" fill="#aaa6b9" font-size="13">Web UI, Figma, CLI, API and</text><text x="18" y="116" fill="#aaa6b9" font-size="13">project exports stay in sync.</text><text x="18" y="148" fill="#74d8a3" font-size="10">localhost:17836</text></g>
</g></svg>
